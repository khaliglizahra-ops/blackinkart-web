<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Black Ink Art — Yönetim Paneli</title>
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />

    <style>
      /* ---------------------------------------------------------------- açılış
         Panel betiği ~1 MB; yavaş bir bağlantıda önce uzun süre bomboş siyah bir
         ekran görünüyordu ve internet yoksa sonsuza kadar öyle kalıyordu. Bu
         ekran anında boyanır, panel geldiğinde kendini siler, gecikirse durumu
         söyler. */
      :root {
        --bia-gold: #f2a900;
        --bia-ink: #0a0a0a;
      }
      html,
      body {
        margin: 0;
        background: var(--bia-ink);
      }
      #bia-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        background: radial-gradient(ellipse at 50% 40%, #16120a 0%, #0a0a0a 70%);
        color: #efe9df;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      #bia-splash img {
        width: min(180px, 55vw);
        height: auto;
      }
      #bia-splash p {
        margin: 0;
        font-size: 0.92rem;
        letter-spacing: 0.04em;
        color: #b3aca1;
      }
      #bia-bar {
        width: min(220px, 60vw);
        height: 2px;
        background: #2c2822;
        overflow: hidden;
      }
      #bia-bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--bia-gold);
        animation: bia-slide 1.5s ease-in-out infinite;
      }
      @keyframes bia-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      #bia-splash.is-error #bia-bar { display: none; }
      #bia-splash.is-error p { color: #f2a900; }

      #bia-reset-storage {
        position: fixed;
        bottom: 10px;
        right: 12px;
        z-index: 10000;
        background: transparent;
        border: 1px solid #2c2822;
        color: #8f8878;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.7rem;
        padding: 0.35em 0.7em;
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.55;
      }
      #bia-reset-storage:hover {
        opacity: 1;
        border-color: var(--bia-gold);
        color: var(--bia-gold);
      }

      /* ------------------------------------------------------------ giriş ekranı
         Yalnızca panelin "çerçevesi" (giriş ekranı ve üst çubuk) markalanıyor.
         Form alanlarına dokunulmuyor: koyu temaya çevirmek, yazı ile zemin
         renginin uyuşmaması hâlinde alanları okunmaz hâle getirme riski taşıyor
         ve panelin kullanılabilirliği görünüşünden önce gelir. */
      #nc-root [class*='-LoginPage'],
      #nc-root section[class*='Login'] {
        background: radial-gradient(ellipse at 50% 35%, #16120a 0%, #0a0a0a 75%) !important;
      }
      #nc-root button[class*='-LoginButton'] {
        background: var(--bia-gold);
        color: #0a0a0a;
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 0;
      }
      #nc-root button[class*='-LoginButton']:hover {
        background: #ffc23d;
      }

      /* Üst çubuk: "Yayınla" düğmesini panelin en görünür ögesi yap. */
      #nc-root [class*='-ToolbarContainer'] {
        border-bottom: 1px solid #2c2822;
      }

      /* ------------------------------------------------------- fotoğraf ızgarası
         Sade fotoğraf listeleri (öne çıkanlar, kategori fotoğrafları, stüdyo vb.)
         Decap'te tek tek alt alta, her biri tam genişlikte geliyordu — 30-40
         fotoğraflık bir listede uzun bir kaydırma ve fotoğrafı görmek için önce
         satırı açmak gerekiyordu. `tagImageGridItems()` (aşağıda) yalnızca TEK
         alanlı (salt görsel) liste öğelerini ".bia-grid-item" ile işaretliyor —
         kategori kartı gibi metin+görsel karışık liste öğelerine dokunmuyor,
         onlar normal tam genişlikte kalıyor. Karma öğeleri ayırt etmek için
         `:has()` içine `:has()` yerleştirmek gerekirdi ki bu geçersiz bir seçici
         (tarayıcı reddediyor); bu yüzden ayrım JS'te yapılıp düz bir sınıf
         ekleniyor. */
      .bia-grid-list {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) !important;
        gap: 12px !important;
      }
      .bia-grid-item {
        margin: 0 !important;
      }
      .bia-grid-item [class*='-NestedObjectLabel'],
      .bia-grid-item [class*='-ControlTopbar'] {
        display: none !important;
      }
      .bia-grid-item [class*='-ImageWrapper-checkerboard'] {
        height: 130px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .bia-grid-item [class*='-StyledImage'] {
        width: 100% !important;
        height: 130px !important;
        object-fit: cover !important;
      }
      .bia-grid-item [class*='-FileWidgetButton'] {
        font-size: 11px !important;
        padding: 4px 6px !important;
      }

      /* Fiyat tablosu satırları gibi yalnızca metin/sayı alanından oluşan
         satırlar: her satırın alanları (uygulama adı, fiyatlar, not) alt alta
         yerine yan yana dizilir — bir tablo satırı gibi. */
      .bia-row-item {
        margin: 0 !important;
      }
      .bia-row-fields {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 10px !important;
        align-items: flex-end !important;
      }
      .bia-row-fields > * {
        flex: 1 1 120px !important;
        min-width: 100px !important;
      }

      /* ------------------------------------------------ önizlemeyi genişlet
         Canlı önizleme varsayılan olarak formun yanında yarı ekran duruyor.
         Bu düğme formu geçici gizleyip önizlemeyi tam genişliğe çıkarır —
         siteye gerçekten girmiş gibi tam boy görmek için. react-split-pane
         .Pane1/.Pane2 genişliği satır-içi style ile kontrol ediyor; bunu
         ezmek için !important dışında güvenilir bir yol yok. */
      #bia-expand-preview {
        position: fixed;
        top: 12px;
        right: 18px;
        z-index: 10000;
        background: var(--bia-gold);
        color: #150f00;
        border: 0;
        border-radius: 4px;
        padding: 0.55em 1.1em;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      #bia-expand-preview[hidden] {
        display: none;
      }
      body.bia-preview-expanded [class*='ControlPaneContainer']:not([class*='PreviewPaneContainer']) {
        display: none !important;
      }
      body.bia-preview-expanded .Pane1 {
        width: 0 !important;
        min-width: 0 !important;
        max-width: 0 !important;
        flex: 0 0 0 !important;
        overflow: hidden !important;
      }
      body.bia-preview-expanded .Pane2 {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        flex: 1 1 100% !important;
      }
      body.bia-preview-expanded .Resizer {
        display: none !important;
      }
    </style>
    <!-- Giriş: kullanıcı adı + şifre, sitenin kendi sunucusunda (/api). -->
  </head>
  <body>
    <div id="bia-splash">
      <img src="/brand/logo-mark.png" alt="Black Ink Art" width="220" height="102" />
      <p id="bia-msg">Yönetim paneli açılıyor…</p>
      <div id="bia-bar"><span></span></div>
    </div>

    <!-- Panel bazen tarayıcıda birikmiş eski bir taslak/oturum verisi yüzünden bir
         ekranda (ör. "Girdiler yükleniyor…") takılı kalabiliyor — bu, siteyle değil
         yalnızca o tarayıcıyla ilgili bir durum. Bu düğme geliştirici konsoluna
         gerek kalmadan o veriyi temizleyip sayfayı yeniler. Her zaman görünür
         durmasın diye küçük ve göze batmayacak şekilde, sağ altta. -->
    <button type="button" id="bia-reset-storage" title="Panel bir ekranda takılı kalırsa buraya basın">
      Panel takıldıysa: verileri temizle
    </button>
    <script>
      document.getElementById('bia-reset-storage').addEventListener('click', function () {
        var ok = window.confirm(
          'Panelin bu tarayıcıda biriktirdiği taslak/oturum verisi temizlenip sayfa yeniden yüklenecek. ' +
          'Yayınlanmış hiçbir içerik etkilenmez. Devam edilsin mi?'
        );
        if (!ok) return;
        try { localStorage.clear(); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        function reload() { location.reload(); }
        if (window.indexedDB && indexedDB.databases) {
          indexedDB.databases().then(function (dbs) {
            var pending = dbs.length;
            if (!pending) return reload();
            dbs.forEach(function (db) {
              var req = indexedDB.deleteDatabase(db.name);
              req.onsuccess = req.onerror = req.onblocked = function () {
                pending -= 1;
                if (pending <= 0) reload();
              };
            });
          }).catch(reload);
        } else {
          try { indexedDB.deleteDatabase('localforage'); } catch (e) {}
          reload();
        }
      });
    </script>

    <script>
      // Panel gerçekten ekrana geldiğinde açılışı kaldır. Decap kendi kökünü
      // (#nc-root) baştan oluşturur ama bir süre boş kalır, o yüzden "kök var mı"
      // yetmiyor — içine gerçek bir arayüz ögesi gelmiş mi diye bakıyoruz.
      (function () {
        var splash = document.getElementById('bia-splash');
        var msg = document.getElementById('bia-msg');
        var start = Date.now();

        function ready() {
          var root = document.getElementById('nc-root');
          if (!root) return false;
          return !!root.querySelector('section, header, main, form, button, a') ||
                 root.getBoundingClientRect().height > 80;
        }

        var timer = setInterval(function () {
          if (ready()) {
            clearInterval(timer);
            splash.style.transition = 'opacity .25s';
            splash.style.opacity = '0';
            setTimeout(function () { splash.remove(); }, 260);
            return;
          }
          var waited = Date.now() - start;
          if (waited > 30000) {
            clearInterval(timer);
            splash.classList.add('is-error');
            msg.textContent =
              'Panel yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.';
          } else if (waited > 8000) {
            msg.textContent = 'Bağlantı yavaş görünüyor, yükleme sürüyor…';
          }
        }, 200);
      })();
    </script>

    <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
    <script>
      // ------------------------------------------------------------- canlı önizleme
      // Rehber yazıları, piercing bölgeleri, sanatçı sayfaları ve fiyat listesi için
      // sitenin gerçek görünümüne yakın bir önizleme. Panel formunun yanında durur ve
      // yazarken/fotoğraf değiştirince ANINDA güncellenir (Decap CMS'in kendi canlı
      // önizleme mekanizması — sunucuya kaydetmeye gerek yok). Stil dosyası
      // preview.css içinde; sitenin src/styles/global.css'inin bir kopyasıdır çünkü
      // asıl dosya derlemede hash'li bir isimle çıkıyor ve buradan kullanılamıyor.
      //
      // Diğer bölümler (portfolyo, ayarlar, hazır tasarımlar) için özel bir önizleme
      // yok — config.yml'de o koleksiyonlarda önizleme kapalı kalıyor, aksi hâlde
      // Decap'in stilsiz ham önizlemesi görünürdü ki bu daha önce kaldırılmıştı.
      var h = window.h || (window.React && window.React.createElement);

      function fmtTl(v) {
        if (v === null || v === undefined || v === '') return '—';
        return v + ' TL';
      }

      function GuidePreview(props) {
        var entry = props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var updatedAt = entry.getIn(['data', 'updatedAt']) || '';
        var heroImagePath = entry.getIn(['data', 'heroImage']);
        var heroUrl = heroImagePath ? String(props.getAsset(heroImagePath)) : null;

        return h('div', { className: 'cms-preview' },
          h('header', {
            className: 'guide-hero' + (heroUrl ? '' : ' no-image'),
            style: heroUrl ? { backgroundImage: 'url(' + heroUrl + ')' } : {},
          },
            h('div', { className: 'guide-hero-overlay' }),
            h('div', { className: 'container guide-hero-inner' },
              h('p', { className: 'eyebrow' }, 'Rehber'),
              h('h1', null, title)
            )
          ),
          h('div', { className: 'container narrow section-tight' },
            updatedAt ? h('p', { className: 'updated' }, 'Güncelleme: ' + updatedAt) : null,
            h('div', { className: 'gold-rule' }),
            h('div', { className: 'prose' }, props.widgetFor('body'))
          )
        );
      }

      function AreaPreview(props) {
        var entry = props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var healingTime = entry.getIn(['data', 'healingTime']) || '';
        var painLevel = entry.getIn(['data', 'painLevel']) || '';
        var priceSlug = entry.getIn(['data', 'priceSlug']) || '';
        var photosField = entry.getIn(['data', 'photos']);
        var photos = photosField ? photosField.toJS() : [];
        var heroPath = photos[0];
        var heroUrl = heroPath ? String(props.getAsset(heroPath)) : null;
        var galleryPaths = photos.slice(1);

        return h('div', { className: 'cms-preview' },
          h('header', {
            className: 'guide-hero' + (heroUrl ? '' : ' no-image'),
            style: heroUrl ? { backgroundImage: 'url(' + heroUrl + ')' } : {},
          },
            h('div', { className: 'guide-hero-overlay' }),
            h('div', { className: 'container guide-hero-inner' },
              h('p', { className: 'eyebrow' }, 'Piercing Bölgesi'),
              h('h1', null, title)
            )
          ),
          h('div', { className: 'container narrow section-tight' },
            h('div', { className: 'badges' },
              healingTime ? h('span', { className: 'badge' }, 'İyileşme: ' + healingTime) : null,
              painLevel ? h('span', { className: 'badge' }, 'Acı: ' + painLevel) : null
            ),
            h('div', { className: 'prose' }, props.widgetFor('body')),
            galleryPaths.length
              ? h('div', { className: 'area-gallery' }, galleryPaths.map(function (p, i) {
                  return h('img', { key: i, src: String(props.getAsset(p)) });
                }))
              : null,
            priceSlug
              ? h('p', { className: 'price-note' }, 'Fiyat tablosu: ' + priceSlug + ' (Fiyatlar bölümünden gelir, burada gösterilmez)')
              : null
          )
        );
      }

      function ArtistPreview(props) {
        var entry = props.entry;
        var name = entry.getIn(['data', 'name']) || '';
        var role = entry.getIn(['data', 'role']) || '';
        var since = entry.getIn(['data', 'since']) || '';
        var photoPath = entry.getIn(['data', 'photo']);
        var photoUrl = photoPath ? String(props.getAsset(photoPath)) : null;

        return h('div', { className: 'cms-preview' },
          h('div', { className: 'container section-tight' },
            h('div', { className: 'artist-layout' },
              h('div', { className: 'photo-col' }, photoUrl ? h('img', { src: photoUrl, alt: name }) : null),
              h('div', { className: 'text-col' },
                h('p', { className: 'eyebrow' }, role),
                h('h1', null, name),
                since ? h('p', { className: 'since' }, 'Sektörde ' + since + '\'ten bu yana') : null,
                h('div', { className: 'gold-rule' }),
                h('div', { className: 'prose' }, props.widgetFor('body'))
              )
            )
          )
        );
      }

      function PricesPreview(props) {
        var entry = props.entry;
        var openingPrice = entry.getIn(['data', 'tattoo', 'openingPrice']);
        var notesField = entry.getIn(['data', 'tattoo', 'notes']);
        var notes = notesField ? notesField.toJS() : [];
        var kdvNote = entry.getIn(['data', 'kdvNote']) || '';
        var multiNote = entry.getIn(['data', 'multiPiercingNote']) || '';
        var tablesField = entry.getIn(['data', 'piercingTables']);
        var tables = tablesField ? tablesField.toJS() : [];

        return h('div', { className: 'cms-preview' },
          h('div', { className: 'container section-tight' },
            h('h1', null, 'Fiyat Listesi'),
            h('div', { className: 'gold-rule' }),
            h('h2', null, 'Dövme'),
            openingPrice !== undefined && openingPrice !== null
              ? h('p', { className: 'opening-price' }, 'Makine açılışı: ' + fmtTl(openingPrice))
              : null,
            notes.length
              ? h('ul', null, notes.map(function (n, i) { return h('li', { key: i }, n); }))
              : null,
            kdvNote ? h('p', null, kdvNote) : null,
            multiNote ? h('p', null, multiNote) : null,
            h('h2', null, 'Piercing'),
            tables.map(function (table, ti) {
              return h('div', { className: 'price-table-wrap', key: ti },
                h('h3', null, table.title),
                h('div', { className: 'price-scroll' },
                  h('table', null,
                    h('thead', null,
                      h('tr', null,
                        h('th', null, 'Uygulama'),
                        h('th', null, 'Çelik'),
                        h('th', null, 'Taşlı/Ring'),
                        h('th', null, 'Titanyum')
                      )
                    ),
                    h('tbody', null, (table.rows || []).map(function (row, ri) {
                      if (row.note) {
                        return h('tr', { key: ri },
                          h('th', { scope: 'row' }, row.name),
                          h('td', { className: 'price-note-row', colSpan: 3 }, row.note)
                        );
                      }
                      return h('tr', { key: ri },
                        h('th', { scope: 'row' }, row.name),
                        h('td', { className: 'price' }, fmtTl(row.steel)),
                        h('td', { className: 'price' }, fmtTl(row.stoneRing)),
                        h('td', { className: 'price' }, fmtTl(row.titanium))
                      );
                    }))
                  )
                )
              );
            })
          )
        );
      }

      function PortfolioPreview(props) {
        var entry = props.entry;
        function imgs(path) {
          var v = entry.getIn(path);
          return v ? v.toJS() : [];
        }
        var featured = imgs(['data', 'featured']);
        var categoriesField = entry.getIn(['data', 'categories']);
        var categories = categoriesField ? categoriesField.toJS() : [];
        var piercingCategoriesField = entry.getIn(['data', 'piercingCategories']);
        var piercingCategories = piercingCategoriesField ? piercingCategoriesField.toJS() : [];
        var studio = imgs(['data', 'studio']);

        function grid(images) {
          return h('div', { className: 'portfolio-grid' }, images.map(function (src, i) {
            return h('div', { className: 'p-tile', key: i }, h('img', { src: String(props.getAsset(src)) }));
          }));
        }

        return h('div', { className: 'cms-preview' },
          h('div', { className: 'container section-tight' },
            h('h1', null, 'Portfolyo'),
            h('div', { className: 'gold-rule' }),
            h('h2', null, 'Öne Çıkanlar'),
            grid(featured),
            categories.length ? h('h2', { style: { marginTop: '2rem' } }, 'Dövme — Stil Kategorileri') : null,
            categories.map(function (cat, i) {
              return h('div', { key: 'd' + i, className: 'p-category' },
                h('h3', null, cat.label),
                grid(cat.images || [])
              );
            }),
            piercingCategories.length ? h('h2', { style: { marginTop: '2rem' } }, 'Piercing — Bölge Kategorileri') : null,
            piercingCategories.map(function (cat, i) {
              return h('div', { key: 'p' + i, className: 'p-category' },
                h('h3', null, cat.label),
                grid(cat.images || [])
              );
            }),
            studio.length ? h('h2', { style: { marginTop: '2rem' } }, 'Stüdyo Fotoğrafları') : null,
            grid(studio)
          )
        );
      }

      function ContactPreview(props) {
        var entry = props.entry;
        var hoursField = entry.getIn(['data', 'hours']);
        var hours = hoursField ? hoursField.toJS() : [];
        var phone = entry.getIn(['data', 'phone']) || '';
        var whatsapp = entry.getIn(['data', 'whatsapp']) || '';
        var email = entry.getIn(['data', 'email']) || '';
        var igHandle = entry.getIn(['data', 'instagram', 'handle']) || '';
        var addressFull = entry.getIn(['data', 'address', 'full']) || '';

        function row(label, value) {
          if (!value) return null;
          return h('li', { key: label }, h('span', { className: 'label' }, label), h('span', { className: 'value' }, value));
        }

        return h('div', { className: 'cms-preview' },
          h('div', { className: 'container section-tight' },
            h('h1', null, 'İletişim Bilgileri'),
            h('div', { className: 'gold-rule' }),
            h('ul', { className: 'info-list' },
              row('Adres', addressFull),
              row('Telefon', phone),
              row('E-posta', email),
              row('WhatsApp', whatsapp),
              row('Instagram', igHandle ? '@' + igHandle.replace(/^@/, '') : '')
            ),
            h('h3', null, 'Çalışma Saatleri'),
            hours.map(function (item, i) {
              return h('p', { className: 'hours', key: i }, h('span', null, item.day), h('span', null, item.hours));
            })
          )
        );
      }

      function TemplatesPreview(props) {
        var entry = props.entry;
        var templatesField = entry.getIn(['data', 'templates']);
        var templates = templatesField ? templatesField.toJS() : [];
        return h('div', { className: 'cms-preview' },
          h('div', { className: 'container section-tight' },
            h('h1', null, '3D Hazır Tasarımlar'),
            h('div', { className: 'gold-rule' }),
            h('div', { className: 'template-grid' }, templates.map(function (tpl, i) {
              return h('div', { className: 'tpl-btn', key: i },
                h('img', { src: String(props.getAsset(tpl.image)) }),
                h('span', { className: 'tpl-label' }, tpl.label)
              );
            }))
          )
        );
      }

      CMS.registerPreviewStyle('/admin/preview.css');
      CMS.registerPreviewTemplate('portfolyo_listesi', PortfolioPreview);
      CMS.registerPreviewTemplate('iletisim', ContactPreview);
      CMS.registerPreviewTemplate('tasarim_listesi', TemplatesPreview);
      CMS.registerPreviewTemplate('dovme-rehberi', GuidePreview);
      CMS.registerPreviewTemplate('dovme-rehberi-en', GuidePreview);
      CMS.registerPreviewTemplate('piercing-rehberi', GuidePreview);
      CMS.registerPreviewTemplate('piercing-rehberi-en', GuidePreview);
      CMS.registerPreviewTemplate('piercing-bolgeleri', AreaPreview);
      CMS.registerPreviewTemplate('piercing-bolgeleri-en', AreaPreview);
      CMS.registerPreviewTemplate('sanatcilar', ArtistPreview);
      CMS.registerPreviewTemplate('sanatcilar-en', ArtistPreview);
      CMS.registerPreviewTemplate('fiyat_listesi', PricesPreview);
    </script>
    <script>
      // Salt görsel liste öğelerini (metin alanı olmayanları) ".bia-grid-item"
      // ile işaretler; CSS'teki ızgara kuralları bunları yakalar. Kategori
      // kartı gibi metin+görsel karışık öğelere dokunmaz.
      //
      // Ayrıca yaprak (alt liste içermeyen), yalnızca metin/sayı alanlarından
      // oluşan satırları (ör. fiyat tablosu satırları: uygulama adı + 3 fiyat +
      // not) ".bia-row-item" ile işaretler — CSS bu alanları tablo satırı gibi
      // yan yana dizer. Tablo kartının kendisi (başlık+kimlik+satırlar listesi)
      // içinde başka bir liste barındırdığı için buna dahil olmaz.
      //
      // İki durumu ayırt etmek için CSS ':has()' içine ':has()' koymak
      // gerekirdi ki bu geçersiz bir seçici (tarayıcı reddediyor); bu yüzden
      // ayrım burada yapılıp düz sınıflar ekleniyor.
      function tagImageGridItems() {
        document.querySelectorAll('[class*="-SortableListItem"]').forEach(function (item) {
          var hasImage = item.querySelector('[aria-label="image field"]');
          var hasString = item.querySelector('[aria-label="string field"]');
          if (hasImage && !hasString) {
            item.classList.add('bia-grid-item');
            if (item.parentElement) item.parentElement.classList.add('bia-grid-list');
            return;
          }
          var hasNestedList = item.querySelector('[class*="-SortableListItem"]');
          var hasListField = item.querySelector('[aria-label="list field"]');
          var hasSelectField = item.querySelector('[aria-label="select field"]');
          if (!hasImage && !hasNestedList && !hasListField && !hasSelectField) {
            var controls = item.querySelectorAll('[class*="-ControlContainer"]');
            if (controls.length >= 2) {
              item.classList.add('bia-row-item');
              var fieldsWrap = controls[0].parentElement;
              if (fieldsWrap) fieldsWrap.classList.add('bia-row-fields');
            }
          }
        });
      }

      // Canlı önizlemeyi tam genişliğe çıkaran düğme. Yalnızca bölünmüş
      // editör görünümündeyken (form + önizleme yan yana) görünür; koleksiyon
      // listesi gibi başka sayfalarda gizlenir. Yeni bir kayda girildiğinde
      // her zaman daraltılmış (form görünür) modda başlar.
      function ensurePreviewExpandButton() {
        var hasSplit = document.querySelector('.Pane1') && document.querySelector('.Pane2');
        var btn = document.getElementById('bia-expand-preview');
        if (!hasSplit) {
          if (btn) btn.hidden = true;
          document.body.classList.remove('bia-preview-expanded');
          return;
        }
        if (!btn) {
          btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'bia-expand-preview';
          btn.addEventListener('click', function () {
            document.body.classList.toggle('bia-preview-expanded');
            updateExpandButtonLabel();
          });
          document.body.appendChild(btn);
        }
        btn.hidden = false;
        updateExpandButtonLabel();
      }

      function updateExpandButtonLabel() {
        var btn = document.getElementById('bia-expand-preview');
        if (!btn) return;
        var expanded = document.body.classList.contains('bia-preview-expanded');
        btn.textContent = expanded ? '← Formu göster' : 'Önizlemeyi genişlet ⛶';
      }

      // Giriş formundaki "E-posta" alanı aslında kullanıcı adı.
      new MutationObserver(function () {
        var f = document.querySelector('#nc-root input[name="email"]');
        if (f && f.placeholder !== 'Kullanıcı adı') {
          f.placeholder = 'Kullanıcı adı';
          f.autocomplete = 'username';
          f.autocapitalize = 'none';
        }
        tagImageGridItems();
        ensurePreviewExpandButton();
      }).observe(document.documentElement, { childList: true, subtree: true });

      // Yedek: bazı listelerde görsel kutusu, satır göründükten kısa bir süre
      // sonra (veri git-gateway'den gelince) DOM'a giriyor — o an mutasyon
      // gözlemcisi zaten tetiklenmiş oluyor ve resim henüz yokken satırı
      // "salt görsel değil" sanıp atlıyor. Kısa aralıklı bu tarama farkı kapatır.
      setInterval(function () {
        tagImageGridItems();
        ensurePreviewExpandButton();
      }, 400);
    </script>
  </body>
</html>
