# main dalına her gönderimde (panelden kaydedilen içerik dahil) siteyi derler
# ve FTP ile Hostinger'daki public_html klasörüne yükler.
# FTP şifresi GitHub Secrets'ta: HUSEYIN (sunucu ve kullanıcı adı gizli değil)
name: Hostinger'a yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Analitik kimlikleri depoya yazılmaz: GitHub → Settings → Secrets and
      # variables → Actions → "Variables" bölümünden okunur. Boşsa site hiçbir
      # analitik kodu yüklemez (bkz. .env.example).
      - run: npm run build
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GTM_ID: ${{ vars.GTM_ID }}

      # Derlenmiş siteyi denetler (SEO, bağlantılar, yasal sayfalar, güvenlik
      # başlıkları). Yayını ENGELLEMEZ: panelden kaydedilen bir içerik
      # değişikliği bir test yüzünden yayınlanamaz hale gelmesin diye; sonuç
      # Actions günlüğünde ve uyarı olarak görünür.
      - name: Testleri çalıştır (yayını engellemez)
        run: npm test
        continue-on-error: true

      - name: FTP ile Hostinger'a yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.158.60
          username: u603584055.blackinkart.com.tr
          password: ${{ secrets.HUSEYIN }}
          protocol: ftps
          local-dir: ./dist/
          # Bu FTP hesabinin koku zaten public_html.
          server-dir: ./
