# main dalına her gönderimde (panelden kaydedilen içerik dahil) siteyi derler
# ve FTP ile Hostinger'daki public_html klasörüne yükler.
# FTP şifresi GitHub Secrets'ta: HUSEYIN (sunucu ve kullanıcı adı gizli değil)
name: Hostinger'a yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: FTP ile Hostinger'a yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.158.60
          username: u603584055.blackinkart.com.tr
          password: ${{ secrets.HUSEYIN }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
